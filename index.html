<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hrisalsa — Salsa Bladi</title>
<meta name="description" content="Hrisalsa : identité de marque d'un restaurant tunisien où la sauce se met à danser. Case study en huit temps.">
<meta property="og:title" content="Hrisalsa — Salsa Bladi">
<meta property="og:description" content="Identité de marque d'un restaurant tunisien. Case study en huit temps.">
<meta property="og:image" content="og.jpg">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=DM+Sans:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--nav:46px;--red:#A60913;--cream:#F6ECD9;--ink:#2A1714;--saf:#F2B53A;--ease:cubic-bezier(.77,0,.18,1);--out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--red);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:clip-path 1.1s var(--ease);clip-path:inset(0 0 0 0)}
#intro.out{clip-path:inset(0 0 100% 0)}
#intro img{width:min(46vw,300px);height:auto;transform:scale(.6) rotate(-14deg);opacity:0;animation:twirl 1.5s var(--out) .15s forwards}
@keyframes twirl{60%{transform:scale(1.04) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
#intro .word{font-family:Marcellus;font-size:clamp(40px,8vw,96px);letter-spacing:.08em;margin-top:18px;display:flex;overflow:hidden}
#intro .word span{display:inline-block;transform:translateY(110%);animation:up .8s var(--out) forwards}
@keyframes up{to{transform:none}}
#intro .count{font-family:'DM Mono',monospace;letter-spacing:.3em;margin-top:26px;font-size:15px;display:flex;gap:18px}
#intro .count i{font-style:normal;opacity:.25;transition:.2s}
#intro .count i.on{opacity:1;color:var(--saf);transform:scale(1.35)}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:10;background:rgba(166,9,19,.96);backdrop-filter:blur(8px);color:var(--cream);display:flex;align-items:center;gap:14px;padding:0 18px;height:var(--nav);transition:transform .45s var(--out)}
nav.hide{transform:translateY(-100%)}
nav .brand{font-family:Marcellus;font-size:18px;letter-spacing:.08em;color:var(--cream);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px}
nav .brand img{width:24px;height:24px;border-radius:50%;transition:transform .6s var(--out)}
nav .brand:hover img{transform:rotate(360deg)}
nav ol{list-style:none;display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;position:relative}
nav ol::-webkit-scrollbar{display:none}
nav a.beat{position:relative;display:flex;align-items:center;gap:8px;color:var(--cream);text-decoration:none;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap;opacity:.65;transition:opacity .3s}
nav a.beat b{display:inline-flex;width:20px;height:20px;border-radius:50%;border:1px solid currentColor;align-items:center;justify-content:center;font-weight:400;transition:all .4s var(--out)}
nav a.beat:hover,nav a.beat.on{opacity:1}
nav a.beat.on b{background:var(--saf);border-color:var(--saf);color:var(--ink);transform:rotate(360deg) scale(1.12)}
#pill{position:absolute;top:0;height:100%;border-radius:999px;background:rgba(246,236,217,.14);transition:left .5s var(--out),width .5s var(--out);pointer-events:none}
#bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--saf);transform-origin:left;transform:scaleX(0)}

/* ---------- pages ---------- */
main{max-width:none;margin:0 auto;padding:2.5vh 1.2vw 1vh}
section{scroll-margin-top:var(--nav)}
.fr{position:relative;overflow:hidden;aspect-ratio:16/9;background:#e9dcc4;border-radius:14px;margin-bottom:6vh;box-shadow:0 24px 60px rgba(42,23,20,.14)}
.fr img{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
.fr.anim{clip-path:inset(18% 8% 18% 8% round 28px)}
.fr.anim img{transform:scale(1.25)}
.fr.anim.in{clip-path:inset(0 0 0 0 round 14px);transition:clip-path 1.3s var(--ease)}
.fr.anim.in img{transition:transform 1.6s var(--out)}
.fr.anim.l{clip-path:inset(0 100% 0 0)} .fr.anim.l.in{clip-path:inset(0 0 0 0 round 14px)}
.fr.anim.r{clip-path:inset(0 0 0 100%)} .fr.anim.r.in{clip-path:inset(0 0 0 0 round 14px)}

/* beat flash */
#flash{position:fixed;left:24px;bottom:28px;z-index:20;pointer-events:none}
#flash div{background:var(--red);color:var(--cream);border-radius:18px;padding:14px 22px 16px;font-family:Marcellus;font-size:26px;line-height:1.1;box-shadow:0 16px 40px rgba(0,0,0,.25);transform:translateX(-130%);opacity:0}
#flash.go div{animation:toast 2.4s var(--out) forwards}
#flash small{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--saf);margin-bottom:6px}
@keyframes toast{14%{transform:none;opacity:1}78%{transform:none;opacity:1}100%{transform:translateX(-130%);opacity:0}}
/* big counter */
#big{position:fixed;right:22px;bottom:18px;z-index:15;font-family:Marcellus;font-size:64px;line-height:1;color:var(--saf);text-shadow:0 2px 14px rgba(0,0,0,.35);height:64px;overflow:hidden;pointer-events:none}
#big span{display:block;transition:transform .6s var(--out)}

/* dancing chili cursor + steam */
@media(pointer:fine){html.chili,html.chili *{cursor:none!important}}
#chili{position:fixed;left:0;top:0;width:44px;height:44px;z-index:200;pointer-events:none;will-change:transform;display:none}
#chili svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 1.5px #F6ECD9) drop-shadow(0 3px 4px rgba(0,0,0,.3));transform-origin:30% 12%;transition:transform .25s var(--out)}
html.chili #chili{display:block}
#chili.hot svg{transform:scale(1.35)}
.puff{position:fixed;width:16px;height:16px;border-radius:50%;pointer-events:none;z-index:199;background:radial-gradient(circle,rgba(214,200,190,.85),rgba(214,200,190,0) 70%);filter:blur(2px);animation:puff 1.1s ease-out forwards}
.puff.warm{background:radial-gradient(circle,rgba(242,181,58,.7),rgba(242,181,58,0) 70%)}
@keyframes puff{to{transform:translate(var(--dx),-46px) scale(3.2);opacity:0}}

.fr.mob{opacity:0;transform:translateY(36px) scale(.96);transition:opacity .6s ease,transform .8s var(--out)}
.fr.mob.in{opacity:1;transform:none}
/* walk into the restaurant */
.walk{position:relative;height:340vh;margin-bottom:6vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;border-radius:14px;background:#1a0b08;box-shadow:0 30px 80px rgba(42,23,20,.16);perspective:1400px}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform,opacity,filter}
.stage .fa{transform-origin:55% 60%}
.stage .sa{opacity:0}
.stage .cap{position:absolute;left:5%;bottom:9%;color:#fff;font-family:Marcellus;font-size:clamp(30px,5vw,84px);line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(30px);transition:opacity .5s,transform .7s var(--out)}
.stage .cap small{display:block;font-family:'DM Mono',monospace;font-size:clamp(11px,1vw,14px);letter-spacing:.25em;text-transform:uppercase;color:var(--saf);margin-bottom:14px}
.stage .cap.on{opacity:1;transform:none}
.stage .hint{position:absolute;right:4%;bottom:6%;color:#fff;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;transition:opacity .4s}
.stage .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));pointer-events:none}
/* palette piano */
.pal{position:relative;aspect-ratio:16/9;border-radius:14px;margin-bottom:6vh;overflow:hidden;background:var(--cream);box-shadow:0 24px 60px rgba(42,23,20,.14);display:flex;user-select:none}
.key{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 1.4vw 4.5%;transform:translateY(-102%);transition:transform .45s cubic-bezier(.3,1.45,.6,1),filter .15s;cursor:pointer;border-right:1px solid rgba(0,0,0,.06);box-shadow:inset 0 -14px 0 rgba(0,0,0,.08)}
.pal.in .key{transform:none}
.key.down{transform:translateY(1.6%)!important;filter:brightness(.9);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 10px 24px rgba(0,0,0,.18);transition:transform .08s,filter .08s}
.key b{font-family:Marcellus;font-weight:400;font-size:clamp(14px,2.3vw,44px);line-height:1}
.key i{font-style:normal;font-family:'DM Mono',monospace;font-size:clamp(8px,.7vw,13px);letter-spacing:.12em;margin-top:.6em;opacity:.8}
.key span{font-size:clamp(8px,.8vw,15px);line-height:1.45;margin-top:.9em;opacity:.9}
.key .note{font-style:normal;position:absolute;top:4%;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:clamp(9px,.8vw,13px);opacity:.45}
.pal .ttl{position:absolute;left:4%;top:9%;z-index:3;background:var(--cream);border-radius:20px;padding:2.2% 2.6%;box-shadow:0 20px 50px rgba(0,0,0,.18);opacity:0;transform:translateY(-20px);transition:all .6s var(--out) .6s;pointer-events:none}
.pal.in .ttl{opacity:1;transform:none}
.pal .ttl small{display:block;font-family:'DM Mono',monospace;font-size:clamp(9px,.8vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.pal .ttl div{font-family:Marcellus;font-size:clamp(22px,4.2vw,80px);line-height:1;margin-top:.25em}
.pal .ttl p{font-family:'DM Mono',monospace;font-size:clamp(8px,.75vw,13px);letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:1em}
/* dishes carousel */
.car{position:relative;border-radius:14px;margin-bottom:6vh;background:var(--ink);color:var(--cream);padding:7vh 0 8vh;overflow:hidden;box-shadow:0 30px 80px rgba(42,23,20,.16)}
.car h2{font-family:Marcellus;font-weight:400;font-size:clamp(34px,5vw,84px);line-height:1;padding:0 5vw}
.car .k{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--saf);padding:0 5vw;margin-bottom:18px}
.car p{padding:0 5vw;margin-top:16px;opacity:.75;max-width:640px;line-height:1.6}
.vp{position:relative}
.track{display:flex;gap:28px;width:max-content;padding:70px 0 40px;will-change:transform}
.arr{position:absolute;top:50%;z-index:5;width:58px;height:58px;border-radius:50%;border:1.5px solid var(--cream);background:rgba(42,23,20,.55);backdrop-filter:blur(6px);color:var(--cream);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);transition:background .3s,transform .3s var(--out)}
.arr:hover{background:var(--red);transform:translateY(-50%) scale(1.1)}
.arr.prev{left:2.5vw}.arr.next{right:2.5vw}
.card{width:clamp(220px,22vw,340px);flex:none;transition:transform .5s var(--out),opacity .4s;cursor:pointer}
.card .ph{aspect-ratio:4/5;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--out)}
.card b{display:block;font-family:Marcellus;font-weight:400;font-size:24px;margin-top:16px}
.card i{font-style:normal;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--saf)}
.track:hover .card{opacity:.45}
.track .card:hover,.track .card.tap{opacity:1;transform:scale(1.18);z-index:2}
.card:hover img{transform:scale(1.08)}
footer{background:var(--red);color:var(--cream);text-align:center;padding:50px 24px 50px;overflow:hidden}
footer img{width:120px;height:120px;border-radius:50%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer h2{font-family:Marcellus;font-weight:400;font-size:clamp(30px,4vw,56px);margin-top:24px}
footer p{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:14px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.btn{position:relative;overflow:hidden;display:inline-block;padding:15px 28px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px;transition:transform .3s var(--out)}
.btn:hover{transform:translateY(-3px)}
.btn.a{background:var(--cream);color:var(--red)}
.btn.b{border:1.5px solid var(--cream);color:var(--cream)}
@media(max-width:700px){:root{--nav:42px}nav{gap:8px;padding:0 10px}nav .brand{font-size:15px}nav .brand img{width:20px;height:20px}nav a.beat span{display:none}nav a.beat{padding:4px}nav a.beat b{width:18px;height:18px;font-size:10px}#big{font-size:38px;height:38px}
  main{padding:1vh 4px 0}.fr,.car,.walk{margin-bottom:2vh}.walk{height:230vh}.stage{height:auto;aspect-ratio:16/9;top:calc(50vh - 28vw)}.stage .cap{font-size:20px;left:4%;bottom:7%}.key span{display:none}.key{padding:0 1.5vw 4%}.key b{font-size:12px}.key i{font-size:7px}.pal .ttl{left:3%;top:6%;padding:2.5% 3%;border-radius:10px}.pal .ttl div{font-size:17px}.pal .ttl p{display:none}.stage .cap small{font-size:9px;margin-bottom:6px}.stage .hint{font-size:8px}.fr,.car,.stage{border-radius:8px}.fr.anim.in,.fr.anim.l.in,.fr.anim.r.in{clip-path:inset(0 round 8px);transition:clip-path .8s var(--ease)}.fr.anim.in img{transition:transform 1s var(--out)}#flash div{font-size:18px;padding:10px 16px}}
@media(max-height:520px) and (orientation:landscape) and (pointer:coarse){:root{--nav:34px}nav a.beat span{display:none}nav a.beat{padding:3px}nav a.beat b{width:18px;height:18px;font-size:10px}nav .brand{font-size:14px}#big{display:none}
  main{padding:0 2px}.fr,.car,.walk{margin-bottom:1.5vh}.fr,.car,.stage{border-radius:6px}#flash{bottom:10px;left:10px}#flash div{font-size:16px;padding:8px 14px}}
@media(prefers-reduced-motion:reduce){#intro{display:none}.fr.anim,.fr.anim img{clip-path:none!important;transform:none!important}#flash,.drop{display:none}}
</style>
</head>
<body class="lock">
<div id="intro">
  <img src="emblem.jpg" alt="">
  <div class="word"></div>
  <div class="count"><i>1</i><i>2</i><i>3</i><i>·</i><i>5</i><i>6</i><i>7</i><i>·</i></div>
</div>

<nav>
  <a class="brand" href="#t1"><img src="emblem.jpg" alt="">HRISALSA</a>
  <ol>
    <li id="pill"></li>
    <li><a class="beat" href="#t1"><b>1</b><span>L'étincelle</span></a></li>
    <li><a class="beat" href="#t2"><b>2</b><span>L'univers</span></a></li>
    <li><a class="beat" href="#t3"><b>3</b><span>Le geste</span></a></li>
    <li><a class="beat" href="#t4"><b>4</b><span>Pause</span></a></li>
    <li><a class="beat" href="#t5"><b>5</b><span>Le langage</span></a></li>
    <li><a class="beat" href="#t6"><b>6</b><span>Le lieu</span></a></li>
    <li><a class="beat" href="#t7"><b>7</b><span>La table</span></a></li>
    <li><a class="beat" href="#t8"><b>8</b><span>Hors les murs</span></a></li>
  </ol>
  <div id="bar"></div>
</nav>
<div id="flash"><div><small></small><span></span></div></div>
<div id="big"><span>1</span></div>

<main id="pages"></main>

<footer>
  <p>Hrisalsa · Salsa Bladi · Projet fictif · 2026</p>
  <div class="btns">
    <a class="btn a" href="Hrisalsa_case_study.pdf" download>Télécharger le PDF</a>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SMALL=matchMedia('(max-width:700px), (pointer:coarse)').matches;
const beats=[[1,4],[5,5],[6,8],[9,9],[10,12],[13,15],[16,19],[20,22]];
const names=["L'étincelle","L'univers","Le geste","Pause","Le langage","Le lieu","La table","Hors les murs"];
const alts={1:"Couverture Hrisalsa",2:"Prologue : salsa, la sauce et la danse",3:"Le nom : Hrissa + Salsa",4:"Le brief et les valeurs",5:"Moodboard",6:"Croquis du logo",7:"L'emblème, le piment qui danse",8:"Déclinaisons du logo",9:"Pause",10:"Couleurs",11:"Typographie",12:"Motifs",13:"La façade",14:"La salle",15:"La table et le néon",16:"Les assiettes",17:"Les plats",18:"Le menu",19:"La tenue du serveur",20:"Instagram",21:"Emballages à emporter",22:"Fin"};

/* walk into the restaurant */
let walk;
function buildWalk(){const w=document.createElement('div');w.className='walk';
  w.innerHTML='<div class="stage"><img class="sa" src="w_salle.jpg" alt="La salle du restaurant Hrisalsa"><img class="fa" src="w_facade.jpg" alt="La façade du restaurant Hrisalsa"><div class="vig"></div>'+
  '<div class="cap c1"><small>Temps 6 · Le lieu</small>Une porte rouge<br>dans la médina.</div>'+
  '<div class="cap c2"><small>Entrez</small>La salsa<br>commence ici.</div><div class="hint">Scroll pour entrer ↓</div></div>';
  walk=w;return w}
const cl=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a)));const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function walkFrame(){if(!walk)return;const r=walk.getBoundingClientRect(),vh=innerHeight;
  const p=Math.min(1,Math.max(0,-r.top/(r.height-vh)));
  const fa=walk.querySelector('.fa'),sa=walk.querySelector('.sa');
  const z=ease(cl(p,0,.5));
  fa.style.transform=`scale(${1+z*4.2})`;fa.style.filter=`blur(${cl(p,.36,.5)*6}px)`;fa.style.opacity=1-cl(p,.38,.52);
  const look=cl(p,.45,1);const sw=Math.sin(look*Math.PI*1.5);
  sa.style.opacity=cl(p,.36,.5);
  sa.style.transform=`scale(${1.45-cl(p,.4,.6)*.15}) rotateY(${sw*-7}deg) translateX(${sw*7}%)`;
  walk.querySelector('.c1').classList.toggle('on',p<.22);
  walk.querySelector('.c2').classList.toggle('on',p>.6&&p<.95);
  walk.querySelector('.hint').style.opacity=p<.05?.8:0}
addEventListener('scroll',walkFrame,{passive:true});addEventListener('resize',walkFrame);
/* palette piano */
function buildPal(){const k=[['#B6261E','#F6ECD9','Harissa','La sauce. La couleur qui signe tout.','Do',261.63],['#F6ECD9','#2A1714','Semoule','Le couscous, le papier, la chaux.','Ré',293.66],['#F2B53A','#2A1714','Safran','Les gouttes de lumière.','Mi',329.63],['#4E8A2E','#F6ECD9','Felfel','La queue du piment, les herbes.','Fa',349.23],['#1E3F9A','#fff','Zellige','Les carreaux, les portes de Sidi Bou Saïd.','Sol',392],['#8FB3E8','#2A1714','Ciel','La fraîcheur du motif bleu.','La',440],['#2A1714','#F6ECD9','Encre','Les textes, le menu, la nuit.','Si',493.88]];
  const p=document.createElement('div');p.className='pal';
  p.innerHTML='<div class="ttl"><small>Temps 5 · Le langage</small><div>La palette<br>en sept pas.</div><p>Passe sur les touches</p></div>'+
    k.map(([bg,fg,n,t,no,f],i)=>`<div class="key" data-f="${f}" style="background:${bg};color:${fg};transition-delay:${i*.07}s"><b>${n}</b><i>${bg.toUpperCase()}</i><span>${t}</span></div>`).join('');
  const keys=[...p.querySelectorAll('.key')];
  const hit=key=>{if(!key)return;key.classList.add('down');setTimeout(()=>key.classList.remove('down'),180)};
  keys.forEach(key=>{key.addEventListener('pointerdown',e=>{e.preventDefault();hit(key)});key.addEventListener('mouseenter',()=>hit(key))});
  let swept=false;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){p.classList.add('in');setTimeout(()=>keys.forEach(x=>x.style.transitionDelay='0s'),1000);io.disconnect()}}),{threshold:.6});
  io.observe(p);return p}
/* dishes carousel */
function buildCar(){const d=[['couscous','Couscous Cha-Cha','1·2·cha-cha-cha · 28 DT'],['ojja','Ojja Mambo','Tempo vif · 22 DT'],['ma9rouna','Ma9rouna Rueda','En cercle · 24 DT']];
  const c=document.createElement('div');c.className='car';
  c.innerHTML='<div class="k">Temps 7 · La table</div><h2>Chaque plat a sa danse.</h2><p>Un plat tunisien, un pas de danse. Passe sur une carte pour la voir de plus près.</p><div class="vp"><button class="arr prev" aria-label="Précédent">←</button><div class="track"></div><button class="arr next" aria-label="Suivant">→</button></div>';
  const t=c.querySelector('.track');const one=d.map(([f,n,x])=>`<div class="card"><div class="ph"><img src="d_${f}.jpg" alt="${n}" loading="lazy"></div><b>${n}</b><i>${x}</i></div>`).join('');
  t.innerHTML=one.repeat(6);
  let x=0,target=null,hover=false,setW=0;
  const measure=()=>{const cs=t.children;setW=cs[d.length].offsetLeft-cs[0].offsetLeft};
  const step=()=>t.children[1].offsetLeft-t.children[0].offsetLeft;
  const wrap=()=>{if(!setW)measure();while(x<=-2*setW)x+=setW;while(x>-setW)x-=setW};
  function tick(){if(!setW)measure();
    if(target!==null){x+=(target-x)*.12;if(Math.abs(target-x)<.5){x=target;target=null;wrap()}}
    else if(!hover&&!RM){x-=.6;wrap()}
    t.style.transform=`translateX(${x}px)`;requestAnimationFrame(tick)}
  t.addEventListener('mouseenter',()=>hover=true);t.addEventListener('mouseleave',()=>{hover=false;t.querySelectorAll('.card.tap').forEach(k=>k.classList.remove('tap'))});
  c.querySelector('.prev').onclick=()=>{wrap();target=(target??x)+step()};
  c.querySelector('.next').onclick=()=>{wrap();target=(target??x)-step()};
  t.addEventListener('click',e=>{const k=e.target.closest('.card');t.querySelectorAll('.card').forEach(z=>z!==k&&z.classList.remove('tap'));if(k){k.classList.toggle('tap');hover=k.classList.contains('tap')}});
  addEventListener('resize',()=>{setW=0});
  requestAnimationFrame(()=>{measure();x=-setW;tick()});
  return c}
/* build pages */
const main=document.getElementById('pages');const frames=[];
beats.forEach(([a,b],i)=>{const s=document.createElement('section');s.id='t'+(i+1);s.dataset.i=i;
  for(let n=a;n<=b;n++){if(n===17){s.appendChild(buildCar());continue}if(n===10){s.appendChild(buildPal());continue}if(n===13){s.appendChild(buildWalk());continue}if(n===14)continue;const f=document.createElement('div');f.className='fr';
    if(n>1&&!RM){f.classList.add('anim');if(n%3===1)f.classList.add('l');else if(n%3===2)f.classList.add('r')}
    const im=new Image();im.src='p'+String(n).padStart(2,'0')+'.jpg?v=4';im.alt=alts[n];if(n>2)im.loading='lazy';
    f.appendChild(im);s.appendChild(f);frames.push(f)}
  main.appendChild(s)});

/* intro */
const intro=document.getElementById('intro');
const word=intro.querySelector('.word');
[...'HRISALSA'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(.55+i*.06)+'s';word.appendChild(s)});
const ticks=[...intro.querySelectorAll('.count i')];
function endIntro(){intro.classList.add('out');document.body.classList.remove('lock');setTimeout(()=>intro.remove(),1200)}
if(RM){intro.remove();document.body.classList.remove('lock')}
else{let k=0;const t=setInterval(()=>{ticks.forEach(x=>x.classList.remove('on'));if(k<ticks.length){ticks[k].classList.add('on');k++}else{clearInterval(t);endIntro()}},230);
  intro.addEventListener('click',()=>{clearInterval(t);endIntro()})}

/* reveal on scroll */
const rev=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting||e.boundingClientRect.top<0){e.target.classList.add('in');rev.unobserve(e.target)}}),{threshold:[0,.04]});
addEventListener('scroll',()=>{for(const f of frames)if(!f.classList.contains('in')&&f.getBoundingClientRect().top<innerHeight*(SMALL?.9:.96))f.classList.add('in')},{passive:true});
frames.forEach(f=>(f.classList.contains('anim')||f.classList.contains('mob'))&&rev.observe(f));

/* parallax + progress */
const bar=document.getElementById('bar');
function onScroll(){const h=document.documentElement;bar.style.transform=`scaleX(${h.scrollTop/(h.scrollHeight-h.clientHeight)})`;
  if(RM)return;const vh=innerHeight;
  for(const f of frames){if(!f.classList.contains('in')&&f.classList.contains('anim'))continue;const r=f.getBoundingClientRect();if(r.bottom<0||r.top>vh)continue;
    const p=(r.top+r.height/2-vh/2)/vh;f.firstChild.style.transform='none'}}
addEventListener('scroll',onScroll,{passive:true});onScroll();walkFrame();
frames.forEach(f=>f.addEventListener('transitionend',onScroll));

/* active beat: pill, flash, big counter */
const links=[...document.querySelectorAll('a.beat')];const pill=document.getElementById('pill');
const flash=document.getElementById('flash');const big=document.querySelector('#big span');let cur=-1,first=true;
function setBeat(i){if(i===cur)return;cur=i;const on=links[i];
  links.forEach((l,j)=>l.classList.toggle('on',j===i));
  pill.style.left=on.parentElement.offsetLeft+'px';pill.style.width=on.parentElement.offsetWidth+'px';
  const ol=on.closest('ol');ol.scrollLeft=on.parentElement.offsetLeft-ol.clientWidth/2+on.parentElement.offsetWidth/2;
  big.style.transform='translateY(-110%)';setTimeout(()=>{big.textContent=(i===3||i===7)?'·':i+1;big.style.transition='none';big.style.transform='translateY(110%)';
    requestAnimationFrame(()=>{big.style.transition='';big.style.transform='none'})},300);
  if(!first&&!RM){flash.querySelector('small').textContent='Temps '+(i+1);flash.querySelector('span').textContent=names[i];flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
  first=false}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setBeat(+e.target.dataset.i)}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));
setBeat(0);

/* hide the top bar while scrolling down, show it when scrolling up */
const navEl=document.querySelector('nav');let lastY=scrollY;
addEventListener('scroll',()=>{const y=scrollY;if(y>lastY+6&&y>120)navEl.classList.add('hide');else if(y<lastY-6||y<120)navEl.classList.remove('hide');lastY=y},{passive:true});
/* smooth anchor scroll */
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href'));if(!t)return;e.preventDefault();
  scrollTo({top:t.getBoundingClientRect().top+scrollY-46,behavior:RM?'auto':'smooth'})}));

/* dancing chili cursor with steam */
if(!RM&&matchMedia('(pointer:fine)').matches){
  document.documentElement.classList.add('chili');
  const c=document.createElement('div');c.id='chili';
  c.innerHTML='<svg viewBox="0 0 44 44"><path d="M13 9c2-4 7-6 10-4" fill="none" stroke="#4E8A2E" stroke-width="3" stroke-linecap="round"/><path d="M12 9c-3 1-4 4-3 7 2 8 7 16 16 23 3 2 6 1 4-2-6-7-8-14-8-22 0-4-2-7-5-7-1 0-3 0-4 1z" fill="#C8322A" stroke="#7A0E0E" stroke-width="1.2"/><path d="M14 13c1 6 4 13 9 19" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/></svg>';
  document.body.appendChild(c);const svg=c.firstChild;
  let mx=-100,my=-100,x=-100,y=-100,vx=0,ang=0,t=0,lastPuff=0;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
  document.addEventListener('mouseover',e=>c.classList.toggle('hot',!!e.target.closest('a,button,.card')));
  document.addEventListener('mouseleave',()=>{mx=my=-100});
  (function loop(n){t=n/1000;const px=x;x+=(mx-x)*.35;y+=(my-y)*.35;vx=x-px;
    const sway=Math.sin(t*6)*8;ang+=((Math.max(-35,Math.min(35,vx*2.2))+sway)-ang)*.15;
    c.style.transform=`translate(${x-12}px,${y-4}px) rotate(${ang}deg)`;
    const sp=Math.abs(vx)+Math.abs(my-y);
    if(sp>1.5&&n-lastPuff>55){lastPuff=n;const p=document.createElement('div');p.className='puff'+(Math.random()<.35?' warm':'');
      p.style.left=(x+4)+'px';p.style.top=(y-6)+'px';p.style.setProperty('--dx',(Math.random()*24-12)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),1100)}
    requestAnimationFrame(loop)})(0);
}
</script>
