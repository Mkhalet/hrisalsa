<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hrisalsa — Salsa Bladi</title>
<meta name="description" content="Hrisalsa : identité de marque d'un restaurant tunisien où la sauce se met à danser. Case study en huit temps.">
<meta property="og:title" content="Hrisalsa — Salsa Bladi">
<meta property="og:description" content="Identité de marque d'un restaurant tunisien. Case study en huit temps.">
<meta property="og:image" content="og.jpg">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=DM+Sans:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--red:#A60913;--cream:#F6ECD9;--ink:#2A1714;--saf:#F2B53A;--ease:cubic-bezier(.77,0,.18,1);--out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--red);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:clip-path 1.1s var(--ease);clip-path:inset(0 0 0 0)}
#intro.out{clip-path:inset(0 0 100% 0)}
#intro img{width:min(46vw,300px);height:auto;transform:scale(.6) rotate(-14deg);opacity:0;animation:twirl 1.5s var(--out) .15s forwards}
@keyframes twirl{60%{transform:scale(1.04) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
#intro .word{font-family:Marcellus;font-size:clamp(40px,8vw,96px);letter-spacing:.08em;margin-top:18px;display:flex;overflow:hidden}
#intro .word span{display:inline-block;transform:translateY(110%);animation:up .8s var(--out) forwards}
@keyframes up{to{transform:none}}
#intro .count{font-family:'DM Mono',monospace;letter-spacing:.3em;margin-top:26px;font-size:15px;display:flex;gap:18px}
#intro .count i{font-style:normal;opacity:.25;transition:.2s}
#intro .count i.on{opacity:1;color:var(--saf);transform:scale(1.35)}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:10;background:rgba(166,9,19,.96);backdrop-filter:blur(8px);color:var(--cream);display:flex;align-items:center;gap:18px;padding:0 24px;height:64px}
nav .brand{font-family:Marcellus;font-size:22px;letter-spacing:.08em;color:var(--cream);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px}
nav .brand img{width:30px;height:30px;border-radius:50%;transition:transform .6s var(--out)}
nav .brand:hover img{transform:rotate(360deg)}
nav ol{list-style:none;display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;position:relative}
nav ol::-webkit-scrollbar{display:none}
nav a.beat{position:relative;display:flex;align-items:center;gap:8px;color:var(--cream);text-decoration:none;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;white-space:nowrap;opacity:.65;transition:opacity .3s}
nav a.beat b{display:inline-flex;width:22px;height:22px;border-radius:50%;border:1px solid currentColor;align-items:center;justify-content:center;font-weight:400;transition:all .4s var(--out)}
nav a.beat:hover,nav a.beat.on{opacity:1}
nav a.beat.on b{background:var(--saf);border-color:var(--saf);color:var(--ink);transform:rotate(360deg) scale(1.12)}
#pill{position:absolute;top:0;height:100%;border-radius:999px;background:rgba(246,236,217,.14);transition:left .5s var(--out),width .5s var(--out);pointer-events:none}
#bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--saf);transform-origin:left;transform:scaleX(0)}

/* ---------- pages ---------- */
main{max-width:1760px;margin:0 auto;padding:7vh 3vw 2vh}
section{scroll-margin-top:64px}
.fr{position:relative;overflow:hidden;aspect-ratio:16/9;background:#e9dcc4;border-radius:22px;margin-bottom:16vh;box-shadow:0 30px 80px rgba(42,23,20,.16)}
.fr img{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
.fr.anim{clip-path:inset(18% 8% 18% 8% round 28px)}
.fr.anim img{transform:scale(1.25)}
.fr.anim.in{clip-path:inset(0 0 0 0 round 22px);transition:clip-path 1.3s var(--ease)}
.fr.anim.in img{transition:transform 1.6s var(--out)}
.fr.anim.l{clip-path:inset(0 100% 0 0)} .fr.anim.l.in{clip-path:inset(0 0 0 0 round 22px)}
.fr.anim.r{clip-path:inset(0 0 0 100%)} .fr.anim.r.in{clip-path:inset(0 0 0 0 round 22px)}

/* beat flash */
#flash{position:fixed;left:24px;bottom:28px;z-index:20;pointer-events:none}
#flash div{background:var(--red);color:var(--cream);border-radius:18px;padding:14px 22px 16px;font-family:Marcellus;font-size:26px;line-height:1.1;box-shadow:0 16px 40px rgba(0,0,0,.25);transform:translateX(-130%);opacity:0}
#flash.go div{animation:toast 2.4s var(--out) forwards}
#flash small{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--saf);margin-bottom:6px}
@keyframes toast{14%{transform:none;opacity:1}78%{transform:none;opacity:1}100%{transform:translateX(-130%);opacity:0}}
/* big counter */
#big{position:fixed;right:22px;bottom:18px;z-index:15;font-family:Marcellus;font-size:64px;line-height:1;color:var(--saf);text-shadow:0 2px 14px rgba(0,0,0,.35);height:64px;overflow:hidden;pointer-events:none}
#big span{display:block;transition:transform .6s var(--out)}

/* chili cursor trail */
.drop{position:fixed;width:10px;height:10px;border-radius:50%;background:var(--red);pointer-events:none;z-index:50;animation:drop .9s ease-out forwards}
@keyframes drop{to{transform:translateY(26px) scale(.2);opacity:0}}

/* walk into the restaurant */
.walk{position:relative;height:340vh;margin-bottom:16vh}
.stage{position:sticky;top:64px;height:calc(100vh - 64px);overflow:hidden;border-radius:22px;background:#1a0b08;box-shadow:0 30px 80px rgba(42,23,20,.16);perspective:1400px}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform,opacity,filter}
.stage .fa{transform-origin:55% 60%}
.stage .sa{opacity:0}
.stage .cap{position:absolute;left:5%;bottom:9%;color:#fff;font-family:Marcellus;font-size:clamp(30px,5vw,84px);line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(30px);transition:opacity .5s,transform .7s var(--out)}
.stage .cap small{display:block;font-family:'DM Mono',monospace;font-size:clamp(11px,1vw,14px);letter-spacing:.25em;text-transform:uppercase;color:var(--saf);margin-bottom:14px}
.stage .cap.on{opacity:1;transform:none}
.stage .hint{position:absolute;right:4%;bottom:6%;color:#fff;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;transition:opacity .4s}
.stage .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));pointer-events:none}
/* dishes carousel */
.car{position:relative;border-radius:22px;margin-bottom:16vh;background:var(--ink);color:var(--cream);padding:7vh 0 8vh;overflow:hidden;box-shadow:0 30px 80px rgba(42,23,20,.16)}
.car h2{font-family:Marcellus;font-weight:400;font-size:clamp(34px,5vw,84px);line-height:1;padding:0 5vw}
.car .k{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--saf);padding:0 5vw;margin-bottom:18px}
.car p{padding:0 5vw;margin-top:16px;opacity:.75;max-width:640px;line-height:1.6}
.track{display:flex;gap:28px;width:max-content;padding:70px 0 40px;animation:marq 40s linear infinite}
.car:hover .track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.card{width:clamp(220px,22vw,340px);flex:none;transition:transform .5s var(--out),opacity .4s;cursor:pointer}
.card .ph{aspect-ratio:4/5;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--out)}
.card b{display:block;font-family:Marcellus;font-weight:400;font-size:24px;margin-top:16px}
.card i{font-style:normal;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--saf)}
.track:hover .card{opacity:.45}
.track .card:hover,.track .card.tap{opacity:1;transform:scale(1.18);z-index:2}
.card:hover img{transform:scale(1.08)}
footer{background:var(--red);color:var(--cream);text-align:center;padding:50px 24px 50px;overflow:hidden}
footer img{width:120px;height:120px;border-radius:50%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer h2{font-family:Marcellus;font-weight:400;font-size:clamp(30px,4vw,56px);margin-top:24px}
footer p{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:14px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.btn{position:relative;overflow:hidden;display:inline-block;padding:15px 28px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px;transition:transform .3s var(--out)}
.btn:hover{transform:translateY(-3px)}
.btn.a{background:var(--cream);color:var(--red)}
.btn.b{border:1.5px solid var(--cream);color:var(--cream)}
@media(max-width:700px){nav{gap:10px;padding:0 12px}nav .brand{font-size:18px}nav a.beat span{display:none}nav a.beat{padding:6px}#big{font-size:44px;height:44px}}
@media(prefers-reduced-motion:reduce){#intro{display:none}.fr.anim,.fr.anim img{clip-path:none!important;transform:none!important}#flash,.drop{display:none}}
</style>
</head>
<body class="lock">
<div id="intro">
  <img src="emblem.jpg" alt="">
  <div class="word"></div>
  <div class="count"><i>1</i><i>2</i><i>3</i><i>·</i><i>5</i><i>6</i><i>7</i><i>·</i></div>
</div>

<nav>
  <a class="brand" href="#t1"><img src="emblem.jpg" alt="">HRISALSA</a>
  <ol>
    <li id="pill"></li>
    <li><a class="beat" href="#t1"><b>1</b><span>L'étincelle</span></a></li>
    <li><a class="beat" href="#t2"><b>2</b><span>L'univers</span></a></li>
    <li><a class="beat" href="#t3"><b>3</b><span>Le geste</span></a></li>
    <li><a class="beat" href="#t4"><b>4</b><span>Pause</span></a></li>
    <li><a class="beat" href="#t5"><b>5</b><span>Le langage</span></a></li>
    <li><a class="beat" href="#t6"><b>6</b><span>Le lieu</span></a></li>
    <li><a class="beat" href="#t7"><b>7</b><span>La table</span></a></li>
    <li><a class="beat" href="#t8"><b>8</b><span>Hors les murs</span></a></li>
  </ol>
  <div id="bar"></div>
</nav>
<div id="flash"><div><small></small><span></span></div></div>
<div id="big"><span>1</span></div>

<main id="pages"></main>

<footer>
  <p>Hrisalsa · Salsa Bladi · Projet fictif · 2026</p>
  <div class="btns">
    <a class="btn a" href="Hrisalsa_case_study.pdf" download>Télécharger le PDF</a>
    <a class="btn b" href="#t1">Revenir au début</a>
  </div>
</footer>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const beats=[[1,4],[5,5],[6,8],[9,9],[10,12],[13,15],[16,19],[20,22]];
const names=["L'étincelle","L'univers","Le geste","Pause","Le langage","Le lieu","La table","Hors les murs"];
const alts={1:"Couverture Hrisalsa",2:"Prologue : salsa, la sauce et la danse",3:"Le nom : Hrissa + Salsa",4:"Le brief et les valeurs",5:"Moodboard",6:"Croquis du logo",7:"L'emblème, le piment qui danse",8:"Déclinaisons du logo",9:"Pause",10:"Couleurs",11:"Typographie",12:"Motifs",13:"La façade",14:"La salle",15:"La table et le néon",16:"Les assiettes",17:"Les plats",18:"Le menu",19:"La tenue du serveur",20:"Instagram",21:"Emballages à emporter",22:"Fin"};

/* walk into the restaurant */
let walk;
function buildWalk(){const w=document.createElement('div');w.className='walk';
  w.innerHTML='<div class="stage"><img class="sa" src="w_salle.jpg" alt="La salle du restaurant Hrisalsa"><img class="fa" src="w_facade.jpg" alt="La façade du restaurant Hrisalsa"><div class="vig"></div>'+
  '<div class="cap c1"><small>Temps 6 · Le lieu</small>Une porte rouge<br>dans la médina.</div>'+
  '<div class="cap c2"><small>Entrez</small>La salsa<br>commence ici.</div><div class="hint">Scroll pour entrer ↓</div></div>';
  walk=w;return w}
const cl=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a)));const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function walkFrame(){if(!walk)return;const r=walk.getBoundingClientRect(),vh=innerHeight;
  const p=Math.min(1,Math.max(0,-r.top/(r.height-vh)));
  const fa=walk.querySelector('.fa'),sa=walk.querySelector('.sa');
  const z=ease(cl(p,0,.5));
  fa.style.transform=`scale(${1+z*4.2})`;fa.style.filter=`blur(${cl(p,.36,.5)*6}px)`;fa.style.opacity=1-cl(p,.38,.52);
  const look=cl(p,.45,1);const sw=Math.sin(look*Math.PI*1.5);
  sa.style.opacity=cl(p,.36,.5);
  sa.style.transform=`scale(${1.45-cl(p,.4,.6)*.15}) rotateY(${sw*-7}deg) translateX(${sw*7}%)`;
  walk.querySelector('.c1').classList.toggle('on',p<.22);
  walk.querySelector('.c2').classList.toggle('on',p>.6&&p<.95);
  walk.querySelector('.hint').style.opacity=p<.05?.8:0}
addEventListener('scroll',walkFrame,{passive:true});addEventListener('resize',walkFrame);
/* dishes carousel */
function buildCar(){const d=[['couscous','Couscous Cha-Cha','1·2·cha-cha-cha · 28 DT'],['ojja','Ojja Mambo','Tempo vif · 22 DT'],['ma9rouna','Ma9rouna Rueda','En cercle · 24 DT'],['menu_a','La carte','4 plats · 4 danses'],['assiettes','Arts de la table','Terre cuite & zellige'],['neon','Le néon','La danseuse en lumière'],['serveur','Le tablier','Le rouge en mouvement'],['interieur','La table','Ambiance du soir']];
  const c=document.createElement('div');c.className='car';
  c.innerHTML='<div class="k">Temps 7 · La table</div><h2>Chaque plat a sa danse.</h2><p>Un plat tunisien, un pas de danse. Passe sur une carte pour la voir de plus près.</p>';
  const t=document.createElement('div');t.className='track';
  const html=d.map(([f,n,x])=>`<div class="card"><div class="ph"><img src="d_${f}.jpg" alt="${n}" loading="lazy"></div><b>${n}</b><i>${x}</i></div>`).join('');
  t.innerHTML=html+html;c.appendChild(t);
  t.addEventListener('click',e=>{const k=e.target.closest('.card');t.querySelectorAll('.card').forEach(x=>x!==k&&x.classList.remove('tap'));k&&k.classList.toggle('tap');t.style.animationPlayState=k&&k.classList.contains('tap')?'paused':''});
  return c}
/* build pages */
const main=document.getElementById('pages');const frames=[];
beats.forEach(([a,b],i)=>{const s=document.createElement('section');s.id='t'+(i+1);s.dataset.i=i;
  for(let n=a;n<=b;n++){if(n===17){s.appendChild(buildCar());continue}if(n===13){s.appendChild(buildWalk());continue}if(n===14)continue;const f=document.createElement('div');f.className='fr';
    if(n>1&&!RM){f.classList.add('anim');if(n%3===1)f.classList.add('l');else if(n%3===2)f.classList.add('r')}
    const im=new Image();im.src='p'+String(n).padStart(2,'0')+'.jpg';im.alt=alts[n];if(n>2)im.loading='lazy';
    f.appendChild(im);s.appendChild(f);frames.push(f)}
  main.appendChild(s)});

/* intro */
const intro=document.getElementById('intro');
const word=intro.querySelector('.word');
[...'HRISALSA'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(.55+i*.06)+'s';word.appendChild(s)});
const ticks=[...intro.querySelectorAll('.count i')];
function endIntro(){intro.classList.add('out');document.body.classList.remove('lock');setTimeout(()=>intro.remove(),1200)}
if(RM){intro.remove();document.body.classList.remove('lock')}
else{let k=0;const t=setInterval(()=>{ticks.forEach(x=>x.classList.remove('on'));if(k<ticks.length){ticks[k].classList.add('on');k++}else{clearInterval(t);endIntro()}},230);
  intro.addEventListener('click',()=>{clearInterval(t);endIntro()})}

/* reveal on scroll */
const rev=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting||e.boundingClientRect.top<0){e.target.classList.add('in');rev.unobserve(e.target)}}),{threshold:[0,.04]});
addEventListener('scroll',()=>{for(const f of frames)if(!f.classList.contains('in')&&f.getBoundingClientRect().top<innerHeight*.96)f.classList.add('in')},{passive:true});
frames.forEach(f=>f.classList.contains('anim')&&rev.observe(f));

/* parallax + progress */
const bar=document.getElementById('bar');
function onScroll(){const h=document.documentElement;bar.style.transform=`scaleX(${h.scrollTop/(h.scrollHeight-h.clientHeight)})`;
  if(RM)return;const vh=innerHeight;
  for(const f of frames){if(!f.classList.contains('in')&&f.classList.contains('anim'))continue;const r=f.getBoundingClientRect();if(r.bottom<0||r.top>vh)continue;
    const p=(r.top+r.height/2-vh/2)/vh;f.firstChild.style.transform=`scale(1.06) translateY(${p*-4}%)`}}
addEventListener('scroll',onScroll,{passive:true});onScroll();walkFrame();
frames.forEach(f=>f.addEventListener('transitionend',onScroll));

/* active beat: pill, flash, big counter */
const links=[...document.querySelectorAll('a.beat')];const pill=document.getElementById('pill');
const flash=document.getElementById('flash');const big=document.querySelector('#big span');let cur=-1,first=true;
function setBeat(i){if(i===cur)return;cur=i;const on=links[i];
  links.forEach((l,j)=>l.classList.toggle('on',j===i));
  pill.style.left=on.parentElement.offsetLeft+'px';pill.style.width=on.parentElement.offsetWidth+'px';
  const ol=on.closest('ol');ol.scrollLeft=on.parentElement.offsetLeft-ol.clientWidth/2+on.parentElement.offsetWidth/2;
  big.style.transform='translateY(-110%)';setTimeout(()=>{big.textContent=(i===3||i===7)?'·':i+1;big.style.transition='none';big.style.transform='translateY(110%)';
    requestAnimationFrame(()=>{big.style.transition='';big.style.transform='none'})},300);
  if(!first&&!RM){flash.querySelector('small').textContent='Temps '+(i+1);flash.querySelector('span').textContent=names[i];flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
  first=false}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setBeat(+e.target.dataset.i)}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));
setBeat(0);

/* smooth anchor scroll */
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href'));if(!t)return;e.preventDefault();
  scrollTo({top:t.getBoundingClientRect().top+scrollY-64,behavior:RM?'auto':'smooth'})}));

/* harissa drops following the cursor */
if(!RM&&matchMedia('(pointer:fine)').matches){let last=0;addEventListener('mousemove',e=>{const n=performance.now();if(n-last<45)return;last=n;
  const d=document.createElement('div');d.className='drop';d.style.left=(e.clientX-5)+'px';d.style.top=(e.clientY-5)+'px';
  if(Math.random()<.3)d.style.background='#F2B53A';document.body.appendChild(d);setTimeout(()=>d.remove(),900)})}
</script>
</body>
</html>
